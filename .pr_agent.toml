# PR-Agent (The-PR-Agent/pr-agent, MIT) on NaN cluster inference.
#
# Why this repo needs a second reviewer, measured rather than assumed (2026-09-06,
# the twelve PRs #14..#28):
#
#   real CodeRabbit review (`## Walkthrough`)    4   (#15 #23 #27 #28)
#   quota decline (`Review limit reached`)       9   (#27 drew both, on different pushes)
#
# CodeRabbit is not a check-run in this repository and there is no branch protection,
# so a declined review leaves no trace in CI beyond the `attested` check run that
# review-attested.yml publishes. Three PRs in four here get no machine review. That is
# the queue this removes: a reviewer whose capacity is ours rather than a vendor's.
#
# Ported from mlorentedev/ts-bridge (`.pr_agent.toml`), itself from dotfiles TOOL-013
# #786 via kubelab TOOL-021 #1140. Numbers, paths and the ignore list below are
# re-derived for this repo; the model-chain reasoning is inherited and cited by issue
# so it can be checked at source.

[config]
# The model, its fallback and the model capacity are set by the shared workflow
# (mlorentedev/ci-workflows pr-agent.yml) through environment variables, which sit
# above this file, so they are not repeated here. Its NaN step does NOT set the
# prompt budget or the timeout, so the two below still govern that path.

# Two ceilings, deliberately different. Confusing them is what broke run 42562380120
# on PR #35 (2026-11-09), so they are now stated apart and guarded by
# scripts/check-harness.mjs.
#
# `custom_model_max_tokens` is LiteLLM's per-model CAPACITY. NaN ids are not in its
# registry, so it must be stated or LiteLLM assumes a small default and truncates the
# diff silently. The shared workflow states it (CONFIG__CUSTOM_MODEL_MAX_TOKENS, 200000)
# on every PR-Agent step, so it is not repeated here.

# `max_model_tokens` is PR-Agent's PROMPT budget — the guardrail that decides how much
# diff is actually sent, and it must sit BELOW that capacity or it never fires. It
# was 200000, i.e. above every diff this repo produces, so it was inert: the PR #35 log
# read `Tokens: 97390, total tokens under limit: 200000, returning full diff`, a
# 97k-token prompt went out whole, and both models in the chain were killed at
# `ai_timeout`. 32000 is upstream's default and is the point of the setting: a diff over
# it is CLIPPED (upstream's `large_patch_policy` is "clip"), so an oversized PR gets a
# partial review instead of eight minutes and no review at all.
max_model_tokens = 32000

# Upstream default is 120s, and 120s is not enough for a reasoning-class model even on a
# clipped prompt: run 42562380120 lost four consecutive calls at 120.1-120.7s. It has to
# be read together with `max_model_tokens` above. The job budget it must fit in is the
# shared workflow's now: its NaN step is bounded at 12 minutes with
# `retry_same_model_on_timeout` off, so a hang ends at that bound and the shared publish
# guard reports it.
ai_timeout = 300

response_language = "en-US"

# README.md is the only context file that exists here. No AGENTS.md, no CLAUDE.md
# (both checked 2026-09-06), so naming either would hand the reviewer a source it
# cannot read. The README's *Traps* section is the part that matters.
repo_context_files = ["README.md"]

[pr_reviewer]
require_score_review = false
require_tests_review = false   # there is no test suite; checks.yml IS the test suite, see below
require_security_review = true
persistent_comment = true
final_update_message = false

# No "compliance sweep" preamble: asked for on every review and delivered once in
# sixteen at dotfiles (#1072). An instruction ignored 94 % of the time is a comment,
# not a control.
extra_instructions = """
Classify each finding as REAL, THEORETICAL or SPECULATIVE. State the class as
the first line of its issue_content, alone on that line and spelled exactly
"Class: REAL", "Class: THEORETICAL" or "Class: SPECULATIVE". The triage reads
only that line; a finding without it goes to a human unclassified.

This is a static site built by Astro: four routes plus a 404, no client framework, no
runtime, served by GitHub Pages through Cloudflare. CI (checks.yml) already verifies that
every route resolves, every referenced asset exists, each page keeps its own title,
canonical and stylesheets, JSON-LD parses, no inline script or inline style survives into
the output, and the Terraform under infra/cloudflare validates and is formatted. A daily
job (edge-drift.yml) diffs what production serves against the repository. Do not restate
what those report.

Spend the budget on what those checks cannot see:

- the routes are rendered from shared components and one layout, so the copy-paste
  divergence that used to be the most common defect here is gone. What replaces it is a
  change made to one route's frontmatter or to src/data/ and not to the others that read
  it; say which routes a hunk should have touched.
- the site ships NO inline scripts and the CSP forbids them; an inline `<script>`, an
  `onclick=` attribute, or a `set:html` of anything authored rather than generated is a
  regression, not a style choice.
- assets are content-hashed by Astro into `_astro/`, so a stale cache is not a concern.
  What is: `astro.config.mjs` deliberately sets `inlineStylesheets: 'never'` and
  `assetsInlineLimit: 0`, because an inlined style block would need a CSP hash the
  moment anything else changed. A build option that reintroduces inlining is a CSP bug.
- infra/cloudflare/ is production: a header, cache rule or zone setting there takes
  effect on apply, and the README in that folder records which toggles the dashboard
  cannot undo (#22). Read a Terraform change for its live consequence.
- a check that cannot fail the way its comment claims. Two regressions shipped through
  review here before checks.yml existed; a guard that would have gone green on them is
  the thing to flag.
- anything that puts a credential in a transcript, a log line, an argv or the process
  table, including in documentation examples.

A REAL finding needs a concrete trace: file and line, failing input, or a command and
its output. If you cannot place a finding, leave it unclassified rather than guessing.
Write in English.
Conventional Commits and no AI attribution are enforced here, so do not propose commit
messages that carry either.
"""

[pr_code_suggestions]
# Present on purpose. Omitting this block is how upstream shipped the tool with its
# stated function disabled: the default `dual_publishing_score_threshold` is -1, which
# never publishes inline. 7 is upstream's own medium boundary.
dual_publishing_score_threshold = 7
suggestions_score_threshold = 5
publish_output_no_suggestions = false

[ignore]
# Applied BEFORE the model call. This repo keeps no credential material in-tree (the
# only secrets live in GitHub's own store), so this list is about spend and signal:
#   - public/images/ and public/fonts/ are binaries;
#   - src/assets/ is the same problem one level down: the cartel, product and video
#     stills are the bulk of the tree by bytes and none of them are reviewable text.
#     Naming the directories is deliberate - a glob on "*.jpg" would also catch a
#     diff that only swaps one, which is exactly the change worth reading;
#   - the Terraform lockfile is resolved hashes a human already reviewed in the PR
#     that bumped it.
glob = [
  "public/images/**",
  "public/fonts/**",
  "src/assets/**",
  "infra/cloudflare/.terraform.lock.hcl",
]
