    /* Critical responsive styles.
       Order matters: these blocks share one specificity, so the LAST matching
       one wins. They must run widest-to-narrowest, matching css/responsive.css
       — otherwise a phone matches every block and lands on the 2048px rule. */
    .about_section .cartel{width:40%;height:auto;text-align:center;display:flex;justify-content:center;align-items:center;margin:0 auto}

    }
    @media (max-width:992px){
      .about_section .cartel{width:60%}
    }
    @media (max-width:768px){

      .about_section .cartel{width:80%}

    }
    @media (max-width:576px){
