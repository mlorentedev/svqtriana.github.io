name: PR Checks and Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same PR
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Job 1: Code Quality Checks
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run check

      - name: Check code formatting with Prettier
        run: npx prettier --check "src/**/*.{astro,ts,js,json,css}"
        continue-on-error: true

  # Job 2: Build Test
  build-test:
    name: Build & Validation
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not created"
            exit 1
          fi
          echo "Build successful! Checking output files..."
          ls -la dist/

      - name: Verify critical files exist
        run: |
          critical_files=(
            "dist/index.html"
            "dist/nosotros/index.html"
            "dist/productos/index.html"
            "dist/media/index.html"
            "dist/encuentro/index.html"
            "dist/robots.txt"
            "dist/sw.js"
          )

          for file in "${critical_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Error: Critical file missing: $file"
              exit 1
            fi
          done
          echo "All critical files present!"

      - name: Check for broken links in HTML
        run: |
          echo "Checking for common broken link patterns..."
          if grep -r "href=\"undefined\"" dist/ || grep -r "src=\"undefined\"" dist/; then
            echo "Error: Found undefined links in HTML"
            exit 1
          fi
          echo "No undefined links found!"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  # Job 3: Performance & Lighthouse Tests
  lighthouse:
    name: Performance Tests (Lighthouse)
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Job 4: Security Checks
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for secrets in code
        run: |
          echo "Checking for potential secrets..."
          if grep -r "password\s*=\s*['\"]" src/ || grep -r "api_key\s*=\s*['\"]" src/; then
            echo "Warning: Potential secrets found in code"
            exit 1
          fi
          echo "No obvious secrets found!"

  # Job 5: Accessibility Tests
  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli

      - name: Start preview server
        run: npm run preview &
        env:
          PORT: 4321

      - name: Wait for server
        run: npx wait-on http://localhost:4321 --timeout 30000

      - name: Run accessibility tests
        run: |
          axe http://localhost:4321 --exit || echo "Accessibility issues found - review needed"
        continue-on-error: true

  # Job 6: Asset Optimization Check
  asset-check:
    name: Asset Optimization
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check image sizes
        run: |
          echo "Checking for large images..."
          large_images=$(find dist/images -type f -size +500k 2>/dev/null || true)
          if [ ! -z "$large_images" ]; then
            echo "Warning: Large images found (>500KB):"
            echo "$large_images"
            echo "Consider optimizing these images"
          else
            echo "All images are optimally sized!"
          fi

      - name: Check total bundle size
        run: |
          echo "Calculating total bundle size..."
          total_size=$(du -sh dist/ | cut -f1)
          echo "Total build size: $total_size"

          # Check if dist size exceeds 10MB
          size_in_mb=$(du -sm dist/ | cut -f1)
          if [ $size_in_mb -gt 10 ]; then
            echo "Warning: Build size exceeds 10MB"
          else
            echo "Build size is within acceptable limits"
          fi

      - name: Check JavaScript bundle sizes
        run: |
          echo "Checking JavaScript bundle sizes..."
          find dist/_astro -name "*.js" -type f -exec ls -lh {} \; | awk '{print $9, $5}'

          # Check for bundles larger than 200KB
          large_bundles=$(find dist/_astro -name "*.js" -type f -size +200k 2>/dev/null || true)
          if [ ! -z "$large_bundles" ]; then
            echo "Warning: Large JavaScript bundles found (>200KB):"
            echo "$large_bundles"
          fi

      - name: Check CSS bundle sizes
        run: |
          echo "Checking CSS bundle sizes..."
          find dist/_astro -name "*.css" -type f -exec ls -lh {} \; | awk '{print $9, $5}'

          # Check for CSS files larger than 100KB
          large_css=$(find dist/_astro -name "*.css" -type f -size +100k 2>/dev/null || true)
          if [ ! -z "$large_css" ]; then
            echo "Warning: Large CSS files found (>100KB):"
            echo "$large_css"
          fi

  # Job 7: HTML Validation
  html-validation:
    name: HTML Validation
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install HTML validator
        run: npm install -g html-validate

      - name: Validate HTML files
        run: |
          echo "Validating HTML files..."
          html-validate "dist/**/*.html" --config .htmlvalidate.json || true
        continue-on-error: true

      - name: Check for common HTML issues
        run: |
          echo "Checking for common HTML issues..."

          # Check for missing alt attributes
          if grep -r "<img[^>]*>" dist/ | grep -v "alt=" ; then
            echo "Warning: Images without alt attributes found"
          fi

          # Check for inline styles (should be minimal)
          inline_styles=$(grep -r "style=\"" dist/*.html | wc -l)
          echo "Inline styles found: $inline_styles"
          if [ $inline_styles -gt 10 ]; then
            echo "Warning: Many inline styles found. Consider moving to CSS."
          fi

          # Check for meta viewport
          for file in dist/*.html; do
            if ! grep -q "viewport" "$file"; then
              echo "Warning: Missing viewport meta tag in $file"
            fi
          done

  # Job 8: Link Checking
  link-check:
    name: Link Validation
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check internal links
        run: |
          echo "Checking for broken internal links..."

          # Check for common broken link patterns
          if grep -r "href=\"undefined\"" dist/ || grep -r "src=\"undefined\"" dist/; then
            echo "Error: Found undefined links"
            exit 1
          fi

          if grep -r "href=\"#\"" dist/ | grep -v "navbar-toggler"; then
            echo "Warning: Found empty anchor links"
          fi

          echo "Internal link check completed"

      - name: Install broken link checker
        run: npm install -g broken-link-checker

      - name: Start preview server
        run: npm run preview &
        env:
          PORT: 4321

      - name: Wait for server
        run: npx wait-on http://localhost:4321 --timeout 30000

      - name: Check for broken links
        run: |
          blc http://localhost:4321 -ro --exclude "instagram.com|facebook.com|twitter.com|google.com|youtube.com|youtu.be" || true
        continue-on-error: true

  # Job 9: Performance Regression Tests
  performance-regression:
    name: Performance Regression
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Analyze bundle size
        run: |
          echo "Analyzing bundle sizes..."

          # Get sizes
          js_size=$(find dist/_astro -name "*.js" -type f -exec du -b {} + | awk '{sum+=$1} END {print sum}')
          css_size=$(find dist/_astro -name "*.css" -type f -exec du -b {} + | awk '{sum+=$1} END {print sum}')
          total_size=$(du -sb dist/ | awk '{print $1}')

          echo "JavaScript total: $(echo $js_size | awk '{print $1/1024 "KB"}')"
          echo "CSS total: $(echo $css_size | awk '{print $1/1024 "KB"}')"
          echo "Total site size: $(echo $total_size | awk '{print $1/1024/1024 "MB"}')"

          # Performance budgets (in bytes)
          MAX_JS_SIZE=307200  # 300KB
          MAX_CSS_SIZE=102400  # 100KB
          MAX_TOTAL_SIZE=20971520  # 20MB

          if [ $js_size -gt $MAX_JS_SIZE ]; then
            echo "::warning::JavaScript bundle exceeds budget (300KB)"
          fi

          if [ $css_size -gt $MAX_CSS_SIZE ]; then
            echo "::warning::CSS bundle exceeds budget (100KB)"
          fi

          if [ $total_size -gt $MAX_TOTAL_SIZE ]; then
            echo "::error::Total site size exceeds budget (20MB)"
            exit 1
          fi

      - name: Check page load sizes
        run: |
          echo "Checking individual page sizes..."
          for file in dist/*.html dist/**/*.html; do
            size=$(du -h "$file" | awk '{print $1}')
            echo "$(basename $file): $size"
          done

  # Job 10: Deployment Simulation
  deployment-simulation:
    name: Deployment Simulation
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify GitHub Pages compatibility
        run: |
          echo "Verifying GitHub Pages compatibility..."

          # Check for CNAME file
          if [ -f "dist/CNAME" ]; then
            echo "✅ CNAME file present"
            cat dist/CNAME
          else
            echo "⚠️  CNAME file missing (optional)"
          fi

          # Check for robots.txt
          if [ -f "dist/robots.txt" ]; then
            echo "✅ robots.txt present"
          else
            echo "⚠️  robots.txt missing"
          fi

          # Check for sitemap
          if [ -f "dist/sitemap-index.xml" ] || [ -f "dist/sitemap.xml" ]; then
            echo "✅ Sitemap present"
          else
            echo "❌ Sitemap missing"
            exit 1
          fi

          # Check for service worker
          if [ -f "dist/sw.js" ]; then
            echo "✅ Service worker present"
          else
            echo "⚠️  Service worker missing"
          fi

          # Check for 404 page
          if [ -f "dist/404.html" ] || [ -f "dist/404/index.html" ]; then
            echo "✅ 404 page present"
          else
            echo "⚠️  404 page missing (will use GitHub's default)"
          fi

      - name: Test server startup
        run: |
          echo "Testing preview server..."
          npm run preview &
          SERVER_PID=$!

          # Wait for server
          npx wait-on http://localhost:4321 --timeout 30000

          # Test homepage loads
          if curl -f http://localhost:4321 > /dev/null 2>&1; then
            echo "✅ Homepage loads successfully"
          else
            echo "❌ Homepage failed to load"
            kill $SERVER_PID
            exit 1
          fi

          # Test other pages
          for page in nosotros productos media encuentro; do
            if curl -f http://localhost:4321/$page > /dev/null 2>&1; then
              echo "✅ /$page loads successfully"
            else
              echo "❌ /$page failed to load"
            fi
          done

          kill $SERVER_PID

  # Job 11: Final Status Check
  pr-status:
    name: PR Status Summary
    runs-on: ubuntu-latest
    needs: [code-quality, build-test, lighthouse, security, accessibility, asset-check, html-validation, link-check, performance-regression, deployment-simulation]
    if: always()

    steps:
      - name: Check all job results
        run: |
          echo "═══════════════════════════════════════════"
          echo "     PR CHECK RESULTS SUMMARY"
          echo "═══════════════════════════════════════════"
          echo ""
          echo "CRITICAL CHECKS:"
          echo "  Code Quality:      ${{ needs.code-quality.result }}"
          echo "  Build Test:        ${{ needs.build-test.result }}"
          echo "  Deployment Sim:    ${{ needs.deployment-simulation.result }}"
          echo ""
          echo "QUALITY CHECKS:"
          echo "  Lighthouse:        ${{ needs.lighthouse.result }}"
          echo "  Security:          ${{ needs.security.result }}"
          echo "  Accessibility:     ${{ needs.accessibility.result }}"
          echo "  HTML Validation:   ${{ needs.html-validation.result }}"
          echo "  Link Check:        ${{ needs.link-check.result }}"
          echo ""
          echo "PERFORMANCE CHECKS:"
          echo "  Asset Check:       ${{ needs.asset-check.result }}"
          echo "  Perf Regression:   ${{ needs.performance-regression.result }}"
          echo ""
          echo "═══════════════════════════════════════════"

      - name: Determine overall status
        run: |
          # Critical checks that MUST pass
          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.build-test.result }}" != "success" ] || \
             [ "${{ needs.deployment-simulation.result }}" != "success" ] || \
             [ "${{ needs.performance-regression.result }}" != "success" ]; then
            echo ""
            echo "❌ CRITICAL CHECKS FAILED"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "The following critical checks must pass before merging:"
            [ "${{ needs.code-quality.result }}" != "success" ] && echo "  ❌ Code Quality"
            [ "${{ needs.build-test.result }}" != "success" ] && echo "  ❌ Build Test"
            [ "${{ needs.deployment-simulation.result }}" != "success" ] && echo "  ❌ Deployment Simulation"
            [ "${{ needs.performance-regression.result }}" != "success" ] && echo "  ❌ Performance Regression"
            echo ""
            echo "PR CANNOT BE MERGED"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi

          # Warning checks that should be reviewed
          warnings=0
          if [ "${{ needs.lighthouse.result }}" != "success" ]; then
            echo "⚠️  Lighthouse performance check failed"
            warnings=$((warnings + 1))
          fi
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "⚠️  Security audit found issues"
            warnings=$((warnings + 1))
          fi
          if [ "${{ needs.accessibility.result }}" != "success" ]; then
            echo "⚠️  Accessibility check found issues"
            warnings=$((warnings + 1))
          fi
          if [ "${{ needs.html-validation.result }}" != "success" ]; then
            echo "⚠️  HTML validation found issues"
            warnings=$((warnings + 1))
          fi
          if [ "${{ needs.link-check.result }}" != "success" ]; then
            echo "⚠️  Link checker found issues"
            warnings=$((warnings + 1))
          fi
          if [ "${{ needs.asset-check.result }}" != "success" ]; then
            echo "⚠️  Asset optimization check found issues"
            warnings=$((warnings + 1))
          fi

          echo ""
          if [ $warnings -gt 0 ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⚠️  $warnings WARNING(S) FOUND"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Review the warnings above before merging."
            echo "Critical checks passed - PR can be merged if warnings are acceptable."
          else
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ ALL CHECKS PASSED"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "PR is ready to merge! 🎉"
          fi
