name: deploy

# Publishes dist/ to GitHub Pages. Every action is pinned by SHA: a tag can be
# moved, a SHA cannot.
#
# Mandatory order at cutover: switch Settings -> Pages -> Source to
# "GitHub Actions" BEFORE the first Astro commit reaches main. With "Deploy
# from a branch", the push that lands this file also fires the legacy Jekyll
# build, which publishes the Astro source and 404s every route. Flipping the
# source first is what makes this trigger safe; the two are not independent.
#
# The flip is not expected to be destructive on its own: changing the source
# stops the legacy build, and the last successful deployment should keep being
# served until this workflow publishes. That expectation is unverified here, so
# check it before merging - `curl -sI https://svqtriana.com/` must still answer
# 200 and serve the old page after the flip. If it does not, the site is down
# from the flip until the deploy run finishes, which is minutes, not hours.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run check:dist

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
