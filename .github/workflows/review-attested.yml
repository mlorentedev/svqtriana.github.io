name: review

# Reports whether this PR was actually reviewed, and re-reports every time the
# answer could have changed.
#
# See #19: four PRs merged within minutes of a CodeRabbit "review limit
# reached" notice, each carrying a green `CodeRabbit: SUCCESS` status and zero
# reviews. A status that goes green when the check did not run is worse than no
# status, because it reads as an answer.
#
# This does not forbid merging unreviewed. It forbids doing so silently: the
# `attested` check goes red, and the way to clear it is to write the disclosure.
#
# It reports through the Checks API rather than through this job's own exit
# status, and that indirection is the whole design. See #26: the job used to BE
# the check, so it could only report at the moment its trigger fired - which is
# before CodeRabbit posts its notice. It went green on #25 for the exact case it
# exists to catch. Creating the check run explicitly means any trigger can
# update the verdict on the PR's head sha, including an issue_comment, whose
# implicit check run lands on the default branch and is therefore useless (#23).
#
# So: the job always exits 0, and `attested` carries the answer.

on:
  pull_request:
  # A review arriving late re-answers the question by itself - which is what
  # happened on #15, 6m25s after the merge.
  pull_request_review:
    types: [submitted]
  # The rate-limit notice and the disclosure are both plain comments, and both
  # change the answer. This trigger only works because of the Checks API.
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  checks: write

# Three triggers can fire within seconds of each other - the notice arrives, a
# review lands, the disclosure is written - and they race. An older run posting
# `failure` after a newer one posted `success` leaves a stale verdict pinned to
# the PR, which is the same class of wrongness this gate exists to remove: a
# check that reports something other than the current state.
#
# Keyed on the PR number, so runs for different PRs never queue behind each
# other, and newest wins within one PR.
concurrency:
  group: attested-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  report:
    # issue_comment also fires for issues, which have no head sha.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: A rate-limit notice is not a review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail

          head=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          echo "head sha: $head"

          # Tell a review from a notice about a review by CONTENT, never by
          # author: a review names files, lines or claims; a notice talks about
          # the review itself. Matching on the author would be the same mistake
          # in a different place, and would break when the reviewer changes.
          notice=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | test("(?i)review limit reached|used all (your )?free .{0,20}reviews|couldn.t start this review"))] | length')

          # Piped to jq rather than using --jq: `gh api` takes a single jq
          # expression and has no --arg, so the head sha has to be bound here.
          reviews=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            | jq --arg h "$head" '[.[] | select(.commit_id == $h and (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or (.state == "COMMENTED" and (.body // "") != "")))] | length')

          # Matched on original_commit_id, NOT commit_id. GitHub rewrites
          # commit_id on an inline comment to the newest commit where the
          # commented lines still apply, so a comment written against an older
          # head starts carrying the new head's sha and would attest a push
          # nobody read (#30, observed on #28). original_commit_id keeps the sha
          # it was written against, which is the only one that answers the
          # question. The review object's commit_id is immutable, so the query
          # above needs no such change.
          inline=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate \
            | jq --arg h "$head" '[.[] | select(.original_commit_id == $h)] | length')

          # The escape hatch, and it is deliberately a sentence someone has to
          # write. "Merged unreviewed, reviewer quota exhausted" is a
          # disclosure; saying nothing is a claim of review that never happened.
          disclosed=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | test("(?i)^#+ *Review triage"))] | length')

          echo "rate-limit notices: $notice"
          echo "reviews on head:    $reviews"
          echo "inline comments:    $inline"
          echo "## Review triage:   $disclosed"

          if [ "$notice" -gt 0 ] && [ "$reviews" -eq 0 ] && [ "$inline" -eq 0 ] && [ "$disclosed" -eq 0 ]; then
            conclusion=failure
            title="Unreviewed, and not disclosed"
            summary=$'A notice says the review could not run, and no review exists on this commit.\n\nMerging unreviewed is allowed. Merging silently is not: post a `## Review triage` comment saying so, and this check clears itself within a minute — no re-run needed.'
          else
            conclusion=success
            if [ "$reviews" -gt 0 ] || [ "$inline" -gt 0 ]; then
              title="Reviewed on this commit"
              summary="A review exists on ${head}."
            elif [ "$disclosed" -gt 0 ]; then
              title="Unreviewed, and disclosed"
              summary="No review on ${head}, and a \`## Review triage\` comment says so."
            else
              title="No reviewer has declined to review"
              summary="No rate-limit notice on this PR. If one arrives, this check re-reports."
            fi
          fi

          # The check run is created against the PR head sha explicitly, which
          # is what lets an issue_comment run update it. Same name every time,
          # so the newest result is the one the PR shows.
          #
          # Failing loudly rather than under set -e. A pull request from a fork
          # gets a read-only GITHUB_TOKEN whatever `checks: write` says, so this
          # POST returns 403 and the job would otherwise die with a stack of gh
          # output and no explanation - a gate that vanishes rather than reports.
          # That is the case for #35, which comes from a fork.
          #
          # The fix is NOT pull_request_target, which runs with a write token in
          # the base repository's context and is the trigger every hardening
          # guide warns about: it would trade a real risk for a hypothetical one.
          #
          # So the fork case is detected and reported instead. The verdict goes
          # out as a warning annotation and the job exits 0, because a check that
          # can never go green on a fork PR is the "status that means nothing"
          # this workflow exists to remove - the mirror image of the bug in #19.
          # The gate is therefore advisory on forks and enforcing everywhere else.
          if ! out=$(gh api -X POST "repos/$REPO/check-runs" \
                       -f name=attested \
                       -f head_sha="$head" \
                       -f status=completed \
                       -f conclusion="$conclusion" \
                       -f output[title]="$title" \
                       -f output[summary]="$summary" \
                       --jq '"reported \(.conclusion) as check run \(.id)"' 2>&1); then
            if printf '%s' "$out" | grep -qE '403|Resource not accessible'; then
              echo "::warning::Cannot publish the 'attested' check run: this token is read-only, which is what a fork PR gets."
              echo "::warning::Verdict that could not be reported: $conclusion - $title"
              echo "$out"
              exit 0
            fi
            echo "$out"
            echo "::error::Could not publish the 'attested' check run, and not for a read-only token."
            echo "::error::Verdict: $conclusion - $title"
            exit 1
          fi
          echo "$out"

          # Always 0. The check run above is the verdict; this job's own status
          # would pin the answer to the moment its trigger fired, which is the
          # defect this design exists to remove.
          echo "job exits 0 by design; the 'attested' check run carries the result"
