name: pr-agent

# The reviewer whose capacity is ours rather than a vendor's.
#
# Measured here on 2026-09-06, over the twelve PRs #14..#28: 4 carried a real
# CodeRabbit review (`## Walkthrough`), 9 carried `Review limit reached` on at
# least one push (#27 drew both). CodeRabbit publishes no check-run in this
# repository, and there is no branch protection, so a declined review is
# invisible to CI unless review-attested.yml catches the notice. This workflow
# does not replace CodeRabbit — it reviews when the vendor's quota is spent,
# which here is three PRs in four.
#
# Ported from mlorentedev/ts-bridge (itself via dotfiles TOOL-013 #786 and
# kubelab TOOL-021 #1140). The exclusions below are re-derived from THIS repo's
# configuration; each one is annotated with what was checked here.
#
# Interaction with review-attested.yml, which predates this file: the `attested`
# check counts formal reviews and inline comments on the head sha through the
# pulls API. PR-Agent publishes through the issues COMMENTS api, so `attested`
# never sees it. A PR reviewed only by PR-Agent while CodeRabbit is rate-limited
# therefore still needs a `## Review triage` comment to turn `attested` green —
# which pr-stewardship requires anyway. `dotf pr triage-queue` DOES see it,
# through the `github-actions` entry in harness/review-attestation.json. The two
# workflows share no concurrency group and no check-run name, so neither cancels
# the other; PR-Agent's own comment is an `issue_comment` that makes `attested`
# re-report, which is the intended direction.

on:
  pull_request:
    # `synchronize` is here so a push gets read, and it is deliberately NOT in
    # `pr_actions` below: upstream routes synchronize through `handle_push_trigger`
    # instead, so listing it there is a setting that looks right and asserts nothing
    # (dotfiles #1053).
    types: [opened, synchronize, reopened, ready_for_review]
  # Slash commands (`/review`, `/improve`, `/describe`) on an existing PR.
  issue_comment:
    types: [created]

concurrency:
  # The event name is part of the key and it is load-bearing. A PR comment is an
  # `issue_comment` whose `issue.number` IS the PR number, so without it a comment
  # triggered run shares this group with the in-flight `pull_request` run and
  # `cancel-in-progress` kills the review. PR-Agent is a Docker action that spends its
  # first ~20 s building, and CodeRabbit's auto-summary comment lands inside that
  # window reliably — measured upstream on two PRs: both cancelled mid-build, both
  # green, zero reviews produced.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # the review comments are the product
  issues: write          # slash-command replies land as issue comments

jobs:
  review:
    # Three conditions, each doing its own work:
    #
    # 1. `issue_comment` fires on issues too, and an issue has no diff.
    # 2. Draft PRs are not asking to be read yet.
    # 3. Dependabot runs are excluded on `github.actor`. This repository has no
    #    .github/dependabot.yml (checked 2026-09-06), so today the rule never
    #    fires; it stays because the day one is added, a Dependabot-triggered run
    #    reads a different secrets store where `secrets.NAN_API_KEY` is "", LiteLLM
    #    cannot authenticate, PR-Agent swallows the failure and exits green, and
    #    the guard step below would fail every bump. Keyed on the actor because
    #    that is the field GitHub reads to choose the store, and it is unforgeable.
    #
    # There is no release-branch exclusion: this repository has no release-please.
    # Versions are CalVer, stamped by scripts/bump-version.py in a commit a human
    # writes, so a version PR is an authored change and gets a review like any other.
    #
    # The author_association gate matters because this repository is PUBLIC:
    # `issue_comment` runs in the base repo context with secrets available, so without
    # it any account could spend the inference budget and exercise
    # `pull-requests: write` on demand.
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false
        && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned by COMMIT, not tag: a tag is mutable, and what runs here holds
      # NAN_API_KEY and `pull-requests: write` on a public repository. Same SHA the
      # sibling repos run (resolved from
      # `gh api repos/The-PR-Agent/pr-agent/git/ref/tags/v0.44.0`); a reviewer bump
      # is its own change with its own measurement.
      - name: PR-Agent
        uses: The-PR-Agent/pr-agent@ab6ec54bfeb37933ddb74259338752e9272016c6  # v0.44.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NAN_API_KEY is provisioned by `dotf secrets sync ci --repo
          # mlorentedev/svqtriana.github.io` once the dotfiles registry lists this
          # repo. Until then it expands to "" and the guard step below is what
          # reports it: PR-Agent itself exits green on a failed inference.
          OPENAI__KEY: ${{ secrets.NAN_API_KEY }}
          OPENAI__API_BASE: https://api.nan.builders/v1
          CONFIG__PUBLISH_OUTPUT_PROGRESS: false
          # Stated rather than defaulted, so the event lists are visible. `synchronize`
          # is absent for the reason in the trigger comment above, and `push_commands`
          # names `/review` ONLY because upstream's default is `['/describe','/review']`
          # — enabling the push trigger without this line would quietly reinstate
          # describe and undo the decision below.
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
          github_action_config.push_trigger_ignore_bot_commits: "true"
          github_action_config.push_trigger_ignore_merge_commits: "true"
          # `describe` REWRITES the PR body, and the bodies here carry the measurement
          # and the reviewer dispositions — the part worth reading. Off as a decision.
          github_action_config.auto_describe: "false"
          github_action_config.auto_review: "true"
          # Suggestions off on the automatic path to halve inference per PR: NaN allows a
          # small number of concurrent requests shared with every other consumer of this
          # key. `## PR Code Suggestions` is also deliberately NOT a review marker in
          # harness/review-attestation.json — suggestions cannot attest a review.
          # `/improve` on demand still works: the [pr_code_suggestions] config stays.
          github_action_config.auto_improve: "false"

      # A review that did not happen must not report success.
      #
      # PR-Agent swallows a failed inference into a clean exit: measured upstream, a
      # green job with no review because the model hit NaN's concurrency limit, and
      # nothing downstream noticed. This step asks the only question that matters — did
      # a comment carrying the declared review marker appear? — and answers it from the
      # registry rather than from a hardcoded string, so a reviewer change is a config
      # edit and not a workflow rewrite.
      #
      # The marker is read from the BASE ref: a pull request that supplied its own
      # registry could otherwise redefine the string that attests it. On the PR that
      # introduces the registry itself, the base has none and this step fails with the
      # first error below — loudly, which is the point.
      - name: Fail if no review was published
        # Only the paths that actually run `/review`. An issue_comment invoking
        # `/describe` legitimately publishes no Guide, and failing those would teach the
        # reader to ignore this check.
        if: >
          always() && (github.event_name == 'pull_request'
            || (github.event_name == 'issue_comment'
                && contains(github.event.comment.body, '/review')))
        env:
          # `github.token`, not `secrets.GITHUB_TOKEN`: identical value, but it is the
          # automatic token rather than a declared repository secret, so nothing that
          # counts "which secrets does this job hold" starts counting an extra one.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          marker=$(gh api "repos/${GITHUB_REPOSITORY}/contents/harness/review-attestation.json?ref=${BASE_REF}" \
            --jq '.content' | base64 -d \
            | jq -r '.reviewers[] | select(.login == "github-actions") | .review_markers[0]')
          if [ -z "${marker}" ] || [ "${marker}" = "null" ]; then
            echo "::error::no review marker declared for github-actions in harness/review-attestation.json"
            exit 1
          fi
          found=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")
          if [ "${found}" -gt 0 ]; then
            echo "review published (marker found: ${marker})"
            exit 0
          fi
          echo "::error::PR-Agent reported success but published no review — no comment carries \"${marker}\"."
          echo "::error::Most likely cause: the credential was absent or NaN concurrency was exhausted."
          echo "::error::Check 'gh api repos/${GITHUB_REPOSITORY}/actions/secrets --jq .secrets[].name' includes NAN_API_KEY."
          exit 1
