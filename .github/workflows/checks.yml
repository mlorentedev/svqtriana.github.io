name: checks

# Every check exists because of a real regression in the previous site:
# duplicate titles, canonicals with .html, navigation injected by JS, ads.txt in
# uppercase, a version that did not match the CHANGELOG, inline scripts blocked
# by the CSP, or referenced assets that did not exist.
#
# Re-enabled on pull_request and push to main: the checks are the only thing that
# runs tests on a contribution, and while this was dispatch-only a pull request
# could merge with nothing but the attested-review gate looking at it (#29).
# Read-only permissions, so it is safe on a fork PR as well.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run check:dist

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Accessibility, mobile menu and routes
        run: npm run test:e2e

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # The harness registries are the contract that pr-agent.yml and
      # review-attested.yml are graded against. Drift between the JSON and the
      # workflow YAML is silent at runtime, so it has to fail here.
      - name: Harness registries agree with the workflows
        run: node scripts/check-harness.mjs

      - name: Every lesson is indexed
        run: bash scripts/check-lessons.sh

      - name: Actions are pinned to a commit SHA
        run: bash scripts/check-actions-pinned.sh

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:lighthouse

      # A failing gate has to leave evidence behind. This job asserted 0.78 for
      # `/` in run 42568386710 and the report died with the runner, so the only
      # way to find out which audit cost the points was to rebuild it locally.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 7

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      # No backend and no credentials: validate checks the configuration, it
      # does not talk to Cloudflare. The apply stays a human act.
      - run: terraform fmt -check -recursive

      # The provider is fetched from the GitHub releases proxy, which hands out
      # 504s often enough to fail this job on its own (run 42568386710). Cache
      # the binary so only a lock-file change ever reaches the network, and
      # retry the cold path instead of failing a PR on someone else's outage.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: terraform-providers-${{ hashFiles('infra/cloudflare/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-

      - name: terraform init
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          # A 504 storm on the releases proxy lasts minutes, not seconds. The
          # first version of this loop backed off 15s twice and still failed
          # run 42570424209: three 504s inside 30s, on a github.com that was
          # healthy again a minute later. Back off exponentially to ~4 minutes.
          delay=15
          attempt=1
          until terraform init -backend=false -no-color; do
            if [ "$attempt" -ge 5 ]; then
              echo "terraform init failed after $attempt attempts" >&2
              exit 1
            fi
            echo "terraform init failed (attempt $attempt/5); retrying in ${delay}s" >&2
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

      - run: terraform validate
